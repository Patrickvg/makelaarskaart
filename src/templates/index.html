<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8' />
  <title>Makelaars op de kaart</title>
  <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
  <script src='https://api.tiles.mapbox.com/mapbox-gl-js/v0.49.0/mapbox-gl.js'></script>
  <link href='https://api.tiles.mapbox.com/mapbox-gl-js/v0.49.0/mapbox-gl.css' rel='stylesheet' />
  <style>
    body { margin:0; padding:0; }
    #map { position:absolute; top:0; bottom:0; width:100%; }
  </style>
</head>
<body>

<div id='map'></div>
<script>
mapboxgl.accessToken = 'pk.eyJ1IjoicHZnZWxkZXIiLCJhIjoiY2o5ODcwZmg3MGs4dTMzcXlkNGZwc2FoNSJ9.dWRMDf1PnBjlvoMynZe-7w';
const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/pvgelder/cjsq6unxa3ot61fmnwocwtbbz',
  center: [4.586733, 51.917319],
  zoom: 10.0
});

var popup = new mapboxgl.Popup({
    closeButton: false,
    closeOnClick: false
});


map.on('mouseenter', 'cjspueidg064y33nzn5m6ii24-0rvbk', function (e) {
    map.getCanvas().style.cursor = 'pointer';

      if (!e.features.length) {
    return;
  }

  var feature = e.features[0];

    popup.setLngLat(feature.geometry.coordinates)
    .setHTML('<h3>' + feature.properties.Makelaarsnaam + '</h3><p>' + feature.properties.Branche + '</p>')
    .setLngLat(feature.geometry.coordinates)
    .addTo(map);
});

// Change it back to a pointer when it leaves.
map.on('mouseleave', 'cjspueidg064y33nzn5m6ii24-0rvbk',function () {
     map.getCanvas().style.cursor = '';
     popup.remove();
});
