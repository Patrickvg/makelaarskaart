<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8' />
  <title>Antwerp Spots</title>
  <meta name='viewport' content='width=device-width, initial-scale=1.0' />
  <link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
  <script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }

    #legend {
      position: absolute;
      bottom: 30px;
      left: 10px;
      background: rgba(255,255,255,0.95);
      border-radius: 8px;
      padding: 12px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      z-index: 1000;
      font-size: 13px;
    }
    #legend h4 { margin: 0 0 10px 0; font-size: 14px; font-weight: 700; color: #333; }
    .legend-item { display: flex; align-items: center; margin-bottom: 6px; }
    .legend-dot { width: 14px; height: 14px; border-radius: 50%; margin-right: 8px; border: 2px solid rgba(0,0,0,0.15); flex-shrink: 0; }
    .legend-label { color: #444; }

    .popup-name { margin: 0 0 3px 0; font-size: 15px; font-weight: 700; color: #222; }
    .popup-address { margin: 0 0 6px 0; font-size: 12px; color: #666; }
    .type-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .type-coffee { background: #FFF0E0; color: #C06000; }
    .type-bar    { background: #F0E8FF; color: #6A0DAD; }
    .type-bakery { background: #E8F5E9; color: #2E7D32; }
  </style>
</head>
<body>
<div id='map'></div>
<div id='legend'>
  <h4>Antwerp Spots</h4>
  <div class='legend-item'><div class='legend-dot' style='background:#E07B00'></div><span class='legend-label'>Coffee</span></div>
  <div class='legend-item'><div class='legend-dot' style='background:#7B2D8B'></div><span class='legend-label'>Bar / Bottle Shop</span></div>
  <div class='legend-item'><div class='legend-dot' style='background:#3A7D44'></div><span class='legend-label'>Bakery</span></div>
</div>
<script>
var map = L.map('map').setView([51.2134, 4.4051], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);

var spots = [
  { name: 'Daily Dose',        address: 'Emiel Banningstraat 58', type: 'coffee',  color: '#E07B00', latlng: [51.2038, 4.4181] },
  { name: 'The Prep Kitchen',  address: 'Begijnenstraat 23',       type: 'coffee',  color: '#E07B00', latlng: [51.2212, 4.3962] },
  { name: 'Shorty Coffee',     address: 'Groendalstraat 8',        type: 'coffee',  color: '#E07B00', latlng: [51.2178, 4.3992] },
  { name: 'Butchers Coffee',   address: 'Kasteelstraat 57',        type: 'coffee',  color: '#E07B00', latlng: [51.2062, 4.3928] },
  { name: 'Bar Bordell',       address: 'Oudemanstraat 34',        type: 'bar',     color: '#7B2D8B', latlng: [51.2278, 4.4002] },
  { name: 'Amber Bottle Shop', address: 'Schermersstraat 25',      type: 'bar',     color: '#7B2D8B', latlng: [51.2185, 4.4058] },
  { name: 'Bakkerij Funk',     address: 'Kronenburgstraat 41A',    type: 'bakery',  color: '#3A7D44', latlng: [51.2098, 4.3958] }
];

var typeLabel = { coffee: 'Coffee', bar: 'Bar / Bottle Shop', bakery: 'Bakery' };

spots.forEach(function(s) {
  var icon = L.divIcon({
    className: '',
    html: '<div style="width:16px;height:16px;border-radius:50%;background:' + s.color + ';border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.4);"></div>',
    iconSize: [16, 16],
    iconAnchor: [8, 8],
    popupAnchor: [0, -10]
  });

  L.marker(s.latlng, { icon: icon })
    .bindPopup(
      '<p class="popup-name">' + s.name + '</p>' +
      '<p class="popup-address">' + s.address + ', Antwerp</p>' +
      '<span class="type-badge type-' + s.type + '">' + typeLabel[s.type] + '</span>'
    )
    .addTo(map);
});
</script>
</body>
</html>
