<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8' />
  <title>Antwerp Spots</title>
  <meta name='viewport' content='width=device-width, initial-scale=1.0' />
  <link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
  <script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    #legend {
      position: absolute;
      bottom: 30px;
      left: 10px;
      background: rgba(255,255,255,0.95);
      border-radius: 8px;
      padding: 12px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      z-index: 1000;
      font-size: 13px;
    }
    #legend h4 { margin: 0 0 10px 0; font-size: 14px; font-weight: 700; color: #333; }
    .legend-item { display: flex; align-items: center; margin-bottom: 6px; }
    .legend-dot { width: 14px; height: 14px; border-radius: 50%; margin-right: 8px; border: 2px solid rgba(0,0,0,0.15); flex-shrink: 0; }
    .legend-label { color: #444; }
    .popup-name { margin: 0 0 3px 0; font-size: 15px; font-weight: 700; color: #222; }
    .popup-address { margin: 0 0 6px 0; font-size: 12px; color: #666; }
    .type-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .type-coffee { background: #FFF0E0; color: #C06000; }
    .type-bar    { background: #F0E8FF; color: #6A0DAD; }
    .type-bakery { background: #E8F5E9; color: #2E7D32; }
    #loading {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 1001;
    }
  </style>
</head>
<body>
<div id='map'></div>
<div id='loading'>Locaties laden…</div>
<div id='legend'>
  <h4>Antwerp Spots</h4>
  <div class='legend-item'><div class='legend-dot' style='background:#E07B00'></div><span class='legend-label'>Coffee</span></div>
  <div class='legend-item'><div class='legend-dot' style='background:#7B2D8B'></div><span class='legend-label'>Bar / Bottle Shop</span></div>
  <div class='legend-item'><div class='legend-dot' style='background:#3A7D44'></div><span class='legend-label'>Bakery</span></div>
</div>
<script>
var MAPBOX_TOKEN = 'pk.eyJ1IjoicHZnZWxkZXIiLCJhIjoiY2o5ODcwZmg3MGs4dTMzcXlkNGZwc2FoNSJ9.dWRMDf1PnBjlvoMynZe-7w';
var CACHE_KEY = 'antwerp_spots_v2';

var map = L.map('map').setView([51.213, 4.400], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19
}).addTo(map);

var spots = [
  { name: 'Daily Dose',        address: 'Emiel Banningstraat 58, Antwerpen', type: 'coffee',  color: '#E07B00' },
  { name: 'The Prep Kitchen',  address: 'Begijnenstraat 23, Antwerpen',       type: 'coffee',  color: '#E07B00' },
  { name: 'Shorty Coffee',     address: 'Groendalstraat 8, Antwerpen',        type: 'coffee',  color: '#E07B00' },
  { name: 'Butchers Coffee',   address: 'Kasteelstraat 57, Antwerpen',        type: 'coffee',  color: '#E07B00' },
  { name: 'Bar Bordell',       address: 'Oudemanstraat 34, Antwerpen',        type: 'bar',     color: '#7B2D8B' },
  { name: 'Amber Bottle Shop', address: 'Schermersstraat 25, Antwerpen',      type: 'bar',     color: '#7B2D8B' },
  { name: 'Bakkerij Funk',     address: 'Kronenburgstraat 41, Antwerpen',     type: 'bakery',  color: '#3A7D44' }
];

var typeLabel = { coffee: 'Coffee', bar: 'Bar / Bottle Shop', bakery: 'Bakery' };

function makeIcon(color) {
  return L.divIcon({
    className: '',
    html: '<div style="width:16px;height:16px;border-radius:50%;background:' + color + ';border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.4);"></div>',
    iconSize: [16, 16], iconAnchor: [8, 8], popupAnchor: [0, -12]
  });
}

function addMarker(spot, lat, lng) {
  L.marker([lat, lng], { icon: makeIcon(spot.color) })
    .bindPopup(
      '<p class="popup-name">' + spot.name + '</p>' +
      '<p class="popup-address">' + spot.address + '</p>' +
      '<span class="type-badge type-' + spot.type + '">' + typeLabel[spot.type] + '</span>'
    ).addTo(map);
}

function geocodeMapbox(spot) {
  var q = encodeURIComponent(spot.address + ', Belgium');
  var url = 'https://api.mapbox.com/geocoding/v5/mapbox.places/' + q +
    '.json?access_token=' + MAPBOX_TOKEN + '&country=BE&limit=1';
  return fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.features && data.features.length) {
        var coords = data.features[0].center;
        return { name: spot.name, lat: coords[1], lng: coords[0] };
      }
      return null;
    });
}

var cached = null;
try { cached = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch(e) {}

if (cached && cached.length === spots.length) {
  document.getElementById('loading').style.display = 'none';
  cached.forEach(function(c) {
    var spot = spots.find(function(s) { return s.name === c.name; });
    if (spot) addMarker(spot, c.lat, c.lng);
  });
} else {
  Promise.all(spots.map(geocodeMapbox)).then(function(results) {
    var valid = results.filter(Boolean);
    valid.forEach(function(c) {
      var spot = spots.find(function(s) { return s.name === c.name; });
      if (spot) addMarker(spot, c.lat, c.lng);
    });
    document.getElementById('loading').style.display = 'none';
    if (valid.length) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(valid)); } catch(e) {}
    }
  });
}
</script>
</body>
</html>
